name: build-deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Restore full sources (src + headers + tools + layout + scripts)
        run: |
          set -euo pipefail
          ls -l dsh-sources.b64
          python3 - <<'PY'
          import base64
          data = open('dsh-sources.b64','rb').read()
          open('/tmp/src.tar.gz','wb').write(base64.b64decode(data))
          PY
          tar xzf /tmp/src.tar.gz -C .
          echo "== restored tree =="
          ls -R src | head -30

      - name: Install toolchain extras
        run: |
          brew install dpkg ldid-procursus7 || brew install dpkg || true
          command -v dpkg-deb

      - name: Build + package (Apple clang, real arm64e)
        run: |
          chmod +x scripts/build-mac.sh
          bash scripts/build-mac.sh

      - name: Inspect
        run: |
          ls -lh packages/
          for f in packages/*.deb; do dpkg-deb -I "$f" | sed -n '1,12p'; done

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-deb
          path: packages/*.deb

        
